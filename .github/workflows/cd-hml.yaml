name: CD HML FRONTEND

on:
  push:
    branches: [ develop ]

jobs:
  deploy-hml:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login ACR Front
        uses: docker/login-action@v2
        with:
          registry: sanguesolidariofront.azurecr.io
          username: ${{ secrets.ACR_USERNAME_FRONT }}
          password: ${{ secrets.ACR_PASSWORD_FRONT }}

      - name: Build e Push Frontend HML
        run: |
          IMAGE="sanguesolidariofront.azurecr.io/sangue-solidario-nextjs"

          docker build \
            --build-arg NEXT_PUBLIC_USERS_SERVICE_URL="" \
            --build-arg NEXT_PUBLIC_DONATION_SERVICE_URL="" \
            --build-arg NEXT_PUBLIC_BLOOD_STOCK_SERVICE_URL="${{ secrets.NEXT_PUBLIC_BLOOD_STOCK_SERVICE_URL }}" \
            --build-arg NEXT_PUBLIC_CDN_SERVICE_URL="" \
            --build-arg NEXT_PUBLIC_CAMPAIGN_SERVICE_URL="" \
            --build-arg NEXT_PUBLIC_APPOINTMENTS_SERVICE_URL="" \
            --build-arg NEXT_PUBLIC_INSTITUTION_SERVICE_URL="" \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="" \
            --build-arg NEXT_PUBLIC_APPLE_CLIENT_ID="" \
            --build-arg NEXT_PUBLIC_MAPBOX_TOKEN="${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}" \
            --build-arg NEXT_PUBLIC_MAPBOX_SESSION_TOKEN="" \
            --build-arg NEXT_PUBLIC_CLARITY_ID="" \
            --build-arg NEXT_PUBLIC_FEATURE_BLOG="false" \
            --build-arg NEXT_PUBLIC_FEATURE_ABOUT_US="false" \
            --build-arg NEXT_PUBLIC_FEATURE_CAMPAIGNS="false" \
            --build-arg NEXT_PUBLIC_FEATURE_APPOINTMENTS="false" \
            -t $IMAGE:hml \
            -t $IMAGE:${{ github.sha }} .

          docker push $IMAGE:hml
          docker push $IMAGE:${{ github.sha }}

      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_HML }}

      - name: Deploy Front HML
        run: |
          az containerapp update \
            --name bloodstock-front-hml \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP_HML }} \
            --image sanguesolidariofront.azurecr.io/sangue-solidario-nextjs:hml